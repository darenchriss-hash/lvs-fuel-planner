name: voice
on:
  push:
    branches: [main]
    paths: ['voice/lines.txt', '.github/workflows/voice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U edge-tts piper-tts
      - name: Make audio
        run: |
          mkdir -p out
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            n=$(printf "%02d" $i)
            if ! edge-tts --voice en-US-JennyNeural --text "$line" --write-media out/$n.mp3; then
              if [ ! -f voice.onnx ]; then
                curl -sL -o voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx
                curl -sL -o voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json
              fi
              echo "$line" | piper -m voice.onnx -f out/$n.wav
            fi
            i=$((i+1))
          done < voice/lines.txt
          ls -la out
      - name: Push to tts branch
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git checkout --orphan tts
          git rm -rf --cached . > /dev/null
          git add out
          git commit -m "voice files"
          git push -f origin tts
